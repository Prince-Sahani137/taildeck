name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes taildeck.py services.py metrics.py xcap.py tests

      - name: Frontend syntax check
        run: node --check app.js

      - name: Service manager and portability tests
        run: python tests/test_services.py

      - name: End-to-end smoke test
        run: python tests/smoke_test.py

      - name: Shell script syntax (Linux)
        if: runner.os == 'Linux'
        run: for f in scripts/*.sh; do sh -n "$f"; done

      - name: Parse PowerShell scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem windows -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) { Write-Host "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
            }
          }
          if ($failed) { exit 1 }
