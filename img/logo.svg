<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TailDeck" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="64" height="64" rx="14" fill="#11141c"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#eef0f5" stroke-opacity="0.12"/>
  <!-- the deck: three stacked screens -->
  <rect x="23" y="11" width="31" height="22" rx="4.5" fill="#11141c" stroke="#42444c" stroke-width="2.5"/>
  <rect x="18" y="16" width="31" height="22" rx="4.5" fill="#11141c" stroke="#7f8288" stroke-width="2.5"/>
  <rect x="13" y="21" width="31" height="22" rx="4.5" fill="#11141c" stroke="#eef0f5" stroke-width="2.75"/>
  <!-- prompt on the front screen -->
  <path d="M20 28.5l5.5 4.5-5.5 4.5" fill="none" stroke="#eef0f5" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29.5 37.5h7" fill="none" stroke="#eef0f5" stroke-width="2.75" stroke-linecap="round"/>
  <!-- the tail: leaves the deck and ends in a tailnet node -->
  <path d="M26 43v4.5c0 5.2 4.2 8.5 9.5 8.5H47" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <circle cx="52.5" cy="56" r="3.6" fill="#e0a458"/>
